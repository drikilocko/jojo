<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTCL — Logistic & Transport</title>
    <meta name="description" content="NTCL Logistic & Transport : fret maritime, aérien et routier, suivi en temps réel et solutions logistiques sur mesure." />
    <meta name="theme-color" content="#08141a" />
    <link rel="icon" href="/favicon.svg" />

    <!-- Image de fond du héro (élément LCP) : préchargée, à la bonne taille pour l'écran -->
    <!-- AVIF (≈ 2× plus léger que le WebP) ; les navigateurs sans AVIF ignorent ce préchargement et prennent le WebP -->
    <link rel="preload" as="image" type="image/avif" media="(min-width: 821px)"
      imagesrcset="/img/port-1280.avif 1280w, /img/port-1920.avif 1920w, /img/port-2560.avif 2560w"
      imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" media="(max-width: 820px)"
      imagesrcset="/img/bateau-640.avif 640w, /img/bateau-960.avif 960w"
      imagesizes="max(100vw, 66.667vh)" fetchpriority="high" />

    <!-- Polices hébergées sur le site (aucune connexion externe avant le premier affichage).
         Fichiers variables : une seule police par famille contient toutes les graisses utilisées. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/unbounded-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plus-jakarta-sans-latin.woff2" crossorigin />
    <style>
      @font-face { font-family: 'Unbounded'; font-style: normal; font-weight: 200 900; font-display: swap;
        src: url(/fonts/unbounded-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 200 800; font-display: swap;
        src: url(/fonts/plus-jakarta-sans-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
